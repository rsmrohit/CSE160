<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Asgn 0</title>
    </head>
    <body onload="main()">
        <canvas id="example" width="400" height="400">
            Your browser does not support the HTML5 canvas tag.
        </canvas>
        <p>
            v1: x <input type="number" name="v1-x" id="v1-x" value="8" /> y
            <input type="number" name="v1-y" id="v1-y" value="2" /> <br />
            v2: x
            <input type="number" name="v2-x" id="v2-x" value="-3" /> y
            <input type="number" name="v2-y" id="v2-y" value="6" />
        </p>

        <p>
            Operation
            <select id="operation">
                <option value="add">Add</option>
                <option value="sub">Subtract</option>
                <option value="mul">Multiply</option>
                <option value="div">Divide</option>
                <option value="mag">Magnitude</option>
                <option value="norm">Normalize</option>
                <option value="angle">AngleBetween</option>
                <option value="area">Area</option>
            </select>
            Scalar
            <input type="number" name="scalar" id="scalar" />
        </p>

        <button id="draw" onclick="handleDrawEvent()">Draw</button>

        <script src="asgn0.js"></script>
        <script src="../lib/cuon-matrix-cse160.js"></script>
    </body>
</html>
