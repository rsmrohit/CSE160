<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Asg1 - Painting Program</title>
    </head>
    <body onload="main()">
        <canvas id="webgl" width="400" height="400">
            Please use a browser that supports "canvas".
        </canvas>

        <p>Color:</p>
        Red: <input type="range" id="redSlider" min="0" max="100" value="100" />
        <br />
        Green:
        <input type="range" id="greenSlider" min="0" max="100" value="0" />
        <br />
        Blue: <input type="range" id="blueSlider" min="0" max="100" value="0" />

        <p>
            Size:
            <input type="range" id="sizeSlider" min="5" max="50" value="10" />
        </p>

        <p>
            Segments:
            <input
                type="range"
                id="segmentsSlider"
                min="3"
                max="30"
                value="10"
            />
        </p>

        <p>Shape:</p>
        <button id="pointBtn">Point</button>
        <button id="triangleBtn">Triangle</button>
        <button id="circleBtn">Circle</button>

<p>Symmetry: 
            <button id="symmetryOffBtn">Off</button>
            <button id="symmetryLrBtn">Left-Right</button>
            <button id="symmetry4Btn">4-Way</button>
            <button id="symmetry6Btn">6-Way</button>
        </p>

        <p>
            <button id="clearBtn">Clear</button>
            <button id="drawPictureBtn">Draw Picture</button>
        </p>

        <script src="cuon-utils.js"></script>
        <script src="shapes.js"></script>
        <script src="main.js"></script>
    </body>
</html>
