        <canvas id="webgl" width="400" height="400">

        Upper Leg:
        <input
            type="range"
            min="0"
            max="360"
            value="0"
            class="slider"
            id="anon-slider"
        />

        Lower Leg:
        <input
            type="range"
            min="0"
            max="360"
            value="0"
            class="slider"
            id="slider-5"
        />

        <br />

        X:
        <input
            type="range"
            min="0"
            max="360"
            value="0"
            class="slider"
            id="angle-slider"
        />

        Y:
        <input
            type="range"
            min="0"
            max="360"
            value="0"
            class="slider"
            id="slider-2"
        />

        Z:
        <input
            type="range"
            min="0"
            max="360"
            value="0"
            class="slider"
            id="slider-3"
        />

        Zoom:
        <input
            type="range"
            min="1"
            max="100"
            value="50"
            class="slider"
            id="slider-4"
        />

        <br />

        <!-- add a checkbox to remove a component -->
        <br />
        Reveal second hump:
        <input type="checkbox" id="remove-hump" />

        <!-- Animation On and off buttons -->
        <br />
        Animation1:
        <button id="start-animation1">ON</button>
